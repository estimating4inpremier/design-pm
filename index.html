<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f8f7;color:#1a1a1a;font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
:root{--blue:#185FA5;--blue-lt:#E6F1FB;--blue-mid:#378ADD;--green:#27500A;--green-lt:#EAF3DE;--green-mid:#639922;--amber:#633806;--amber-lt:#FAEEDA;--amber-mid:#BA7517;--red:#791F1F;--red-lt:#FCEBEB;--red-mid:#E24B4A;--gray:#444441;--gray-lt:#F1EFE8;--border:#e5e5e3;--surface:#fff;--page:#f8f8f7;--muted:#666662;--hint:#999994;--radius:8px;--radius-lg:12px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;background:var(--page)}
.logo{padding:20px 16px 12px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--muted);border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:#f5f5f3;color:#1a1a1a}
.nav-item.active{background:#EAF3DE;color:var(--green);border-left:3px solid var(--green-mid);font-weight:500}
.sidebar-bottom{margin-top:auto;padding:16px;border-top:1px solid var(--border)}
.new-btn{width:100%;padding:9px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-bottom:8px}
.new-btn:hover{background:#0C447C}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:#1a1a1a;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover{background:#f5f5f3}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#0C447C}
.btn-red{color:var(--red-mid);border-color:var(--red-mid)}
.btn-red:hover{background:var(--red-lt)}
.btn-green{color:var(--green);border-color:var(--green-mid)}
.btn-green:hover{background:var(--green-lt)}
.icon-btn{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;color:var(--muted);font-size:14px;font-family:inherit}
.icon-btn:hover{background:#f5f5f3;color:#1a1a1a}
.icon-btn.red:hover{background:var(--red-lt);color:var(--red-mid);border-color:var(--red-mid)}
.content{padding:24px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.metric-val{font-size:26px;font-weight:500}
.metric-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.metric-sub{font-size:11px;margin-top:6px;font-weight:500;color:var(--amber-mid)}
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden}
.proj-hd{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.proj-hd:hover{background:#fafaf9}
.color-bar{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:500}
.proj-meta{font-size:12px;color:var(--muted);margin-top:2px}
.proj-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.prog-wrap{width:88px}
.prog-track{height:5px;background:#eee;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--blue-mid)}
.prog-label{font-size:11px;color:var(--muted);margin-top:2px;text-align:right}
.proj-body{border-top:1px solid var(--border);padding:0 20px 16px}
.unit-card{border:1px solid var(--border);border-radius:var(--radius);margin-top:12px;overflow:hidden}
.unit-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fafaf9;cursor:pointer;user-select:none;flex-wrap:wrap}
.unit-hd:hover{background:#f5f5f3}
.unit-name{font-size:13px;font-weight:500;flex:1;min-width:100px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.b-fp{background:var(--blue-lt);color:var(--blue)}.b-rv{background:var(--amber-lt);color:var(--amber)}.b-dd{background:var(--green-lt);color:var(--green)}
.b-done{background:var(--green-lt);color:var(--green)}.b-wip{background:var(--amber-lt);color:var(--amber)}.b-todo{background:var(--gray-lt);color:var(--gray)}
.b-high{background:var(--red-lt);color:var(--red)}.b-med{background:var(--amber-lt);color:var(--amber)}.b-low{background:var(--green-lt);color:var(--green)}
.warn-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--amber-mid);background:var(--amber-lt);border-radius:4px;padding:2px 7px}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
.cell-sel{border:1px solid transparent;background:transparent;font-size:12px;color:#1a1a1a;cursor:pointer;padding:3px 5px;border-radius:4px;font-family:inherit}
.cell-sel:hover{background:#f0f0ee;border-color:var(--border)}
.cell-sel:focus{outline:none;border-color:var(--blue-mid);background:#fff}
.dl-chip{font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px}
.dl-ok{background:var(--green-lt);color:var(--green)}.dl-warn{background:var(--amber-lt);color:var(--amber)}.dl-over{background:var(--red-lt);color:var(--red)}
.stage-tbl{width:100%;border-collapse:collapse;font-size:12px}
.stage-tbl th{padding:8px 12px;text-align:left;font-weight:500;color:var(--muted);background:#fafaf9;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.stage-tbl td{padding:9px 12px;border-bottom:1px solid #f0f0ee;vertical-align:middle}
.stage-tbl tr:last-child td{border-bottom:none}
.stage-tbl tr:hover td{background:#fafaf9}
.hm-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px}
.hm-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px}
.hm-scroll{overflow-x:auto}
.hm-tbl{border-collapse:collapse;font-size:12px;width:100%}
.hm-tbl th{padding:10px 6px;text-align:center;font-weight:500;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;min-width:58px}
.hm-tbl th.dc{text-align:left;min-width:130px;padding-left:20px}
.hm-tbl td{padding:6px;text-align:center;border-bottom:1px solid #f0f0ee}
.hm-tbl td.dc{text-align:left;padding-left:20px;padding-right:12px}
.hm-tbl .tot-row td{background:#fafaf9;font-weight:600;border-top:1px solid var(--border)}
.hcell{display:inline-flex;align-items:center;justify-content:center;width:38px;height:26px;border-radius:5px;font-size:12px;font-weight:500}
.h0{background:#f5f5f3;color:var(--hint)}.h1{background:#D4EBBF;color:#27500A}.h2{background:#FAC775;color:#633806}.h3{background:#F09595;color:#791F1F}
.legend{display:flex;align-items:center;gap:16px;padding:12px 20px;border-top:1px solid var(--border);background:#fafaf9;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.ldot{width:10px;height:10px;border-radius:3px}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.sum-tbl{width:100%;border-collapse:collapse;font-size:13px}
.sum-tbl th{padding:10px 16px;text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#fafaf9;border-bottom:1px solid var(--border);white-space:nowrap}
.sum-tbl td{padding:11px 16px;border-bottom:1px solid #f0f0ee;vertical-align:middle}
.sum-tbl tr:last-child td{border-bottom:none}
.sum-tbl tr:hover td{background:#fafaf9}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;z-index:100}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:460px;max-width:95%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:500}
.modal-body{padding:20px}
.modal-ft{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:#1a1a1a;background:var(--surface);font-family:inherit}
.field textarea{resize:vertical;min-height:120px;font-size:11px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue-mid)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.date-note{font-size:11px;color:var(--amber-mid);margin-top:4px}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.confirm-box{background:var(--surface);border-radius:var(--radius-lg);width:340px;box-shadow:0 8px 32px rgba(0,0,0,.15);padding:24px}
.confirm-box p{font-size:14px;margin-bottom:16px;line-height:1.6}
.cname{font-weight:500;color:var(--red-mid)}
.alert-bar{display:flex;align-items:center;gap:10px;background:var(--red-lt);color:var(--red);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:13px}
.search-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:400px}
.search-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:15px;pointer-events:none}
.search-wrap input{width:100%;padding:8px 10px 8px 34px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--surface);color:#1a1a1a}
.search-wrap input:focus{outline:none;border-color:var(--blue-mid)}
.search-hint{font-size:12px;color:var(--muted);margin-bottom:16px;min-height:18px}
.archive-unit-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f0ee}
.archive-unit-row:last-child{border-bottom:none}
.archive-sec-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
@keyframes tIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes tOut{from{opacity:1}to{opacity:0;transform:translateY(8px)}}
#toast-wrap{position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;animation:tIn .22s ease forwards}
.toast.out{animation:tOut .3s ease forwards}
.toast.err{background:#791F1F}
.setup-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--page)}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:500px;max-width:95%;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.setup-card h2{font-size:18px;font-weight:600;margin-bottom:.5rem}
.setup-card p{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.6}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:8px 12px;background:var(--page);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green-mid);flex-shrink:0}
.sync-dot.syncing{background:var(--amber-mid);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red-mid)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div id="toast-wrap"></div>
<div id="root"></div>
<script>
// ================================================================
// CONSTANTS
// ================================================================
var SHEET_ID='1QtaihYaWMhgi1HaQEuhgw1fu5-w_eUlSQFKgWpGW03w';
var BH=new Set(['2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-05-26','2025-08-25','2025-12-25','2025-12-26','2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-08-31','2026-12-25','2026-12-28','2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-05-31','2027-08-30','2027-12-27','2027-12-28']);
var DESIGNERS=[{id:'d1',name:'Tony',ini:'TO',bg:'#B5D4F4',fg:'#0C447C'},{id:'d2',name:'Prasad',ini:'PR',bg:'#9FE1CB',fg:'#085041'},{id:'d3',name:'Jayesh',ini:'JA',bg:'#FAC775',fg:'#633806'},{id:'d4',name:'Mahmood',ini:'MA',bg:'#F4C0D1',fg:'#72243E'},{id:'d5',name:'Sohail',ini:'SO',bg:'#CECBF6',fg:'#3C3489'},{id:'d6',name:'Nithesh',ini:'NI',bg:'#C0DD97',fg:'#27500A'}];
var SDEFS=[{id:'fp',lbl:'Front page',days:3},{id:'rv1',lbl:'Revision 1',days:2},{id:'rv2',lbl:'Revision 2',days:2},{id:'rv3',lbl:'Revision 3',days:2},{id:'dd',lbl:'Detailed drawings',days:5}];
var PCOLS=['#378ADD','#639922','#BA7517','#E24B4A','#7F77DD','#1D9E75'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var PRI_ORDER={high:0,medium:1,low:2};
var PROJ_PRI_ORDER={high:0,medium:1,low:2};

// ================================================================
// DATE UTILS
// ================================================================
function str2date(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function pad2(n){return String(n).padStart(2,'0');}
function date2str(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return date2str(new Date());}
function isBlocked(s){var w=str2date(s).getDay();return w===0||w===6||BH.has(s);}
function nextWorkday(s){var d=str2date(s);while(isBlocked(date2str(d)))d.setDate(d.getDate()+1);return date2str(d);}
function addWorkdays(s,n){if(n<=0)return nextWorkday(s);var d=str2date(s),a=0;while(a<n){d.setDate(d.getDate()+1);if(!isBlocked(date2str(d)))a++;}return date2str(d);}
function fmtDate(s){return str2date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function fmtDateY(s){return str2date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function daysToDate(s){return Math.round((str2date(s)-new Date())/864e5);}
function getWorkdays14(){var r=[],d=new Date();while(r.length<14){var s=date2str(d);if(!isBlocked(s))r.push(s);d.setDate(d.getDate()+1);}return r;}
function getWorkdays8w(from){var r=[],end=new Date(str2date(from));end.setDate(end.getDate()+56);var d=new Date(str2date(from));while(d<=end){var s=date2str(d);if(!isBlocked(s))r.push(s);d.setDate(d.getDate()+1);}return r;}

// ================================================================
// HELPERS
// ================================================================
function getDesigner(id){return DESIGNERS.find(function(d){return d.id===id;})||DESIGNERS[0];}
function getStageDef(id){return SDEFS.find(function(s){return s.id===id;});}
function priLabel(p){return{high:'High',medium:'Medium',low:'Low'}[p]||'Medium';}
function priBadge(p){return{high:'b-high',medium:'b-med',low:'b-low'}[p]||'b-med';}
function stageBadge(id){return id==='fp'?'b-fp':id.startsWith('rv')?'b-rv':'b-dd';}
function avHtml(d){return '<div class="av" style="background:'+d.bg+';color:'+d.fg+'">'+d.ini+'</div>';}
function dlChip(inst){var d=daysToDate(inst);if(d<0)return'<span class="dl-chip dl-over">'+Math.abs(d)+'d overdue</span>';if(d===0)return'<span class="dl-chip dl-warn">Due today</span>';if(d<=14)return'<span class="dl-chip dl-warn">'+d+'d left</span>';return'<span class="dl-chip dl-ok">'+d+'d to install</span>';}
function mkId(){return 'id'+Date.now()+Math.random().toString(36).slice(2,6);}

function buildSearchBar(inputId,searchVal,searchBy,oninputFn,clearFn,setByFn,hint){
  return '<div class="search-bar">'
    +'<div class="search-wrap"><span>&#128269;</span>'
    +'<input id="'+inputId+'" type="text" placeholder="Search projects, clients or units..." value="'+searchVal+'" oninput="'+oninputFn+'(this.value)">'
    +'</div>'
    +'<div style="display:flex;gap:6px;flex-shrink:0">'
    +'<button class="btn'+(searchBy==='project'?' btn-primary':'')+'" onclick="'+setByFn+'(\'project\')">Project</button>'
    +'<button class="btn'+(searchBy==='client'?' btn-primary':'')+'" onclick="'+setByFn+'(\'client\')">Client</button>'
    +'<button class="btn'+(searchBy==='unit'?' btn-primary':'')+'" onclick="'+setByFn+'(\'unit\')">Unit</button>'
    +'<button class="btn'+(searchBy==='all'?' btn-primary':'')+'" onclick="'+setByFn+'(\'all\')">All</button>'
    +'</div>'
    +(searchVal?'<button class="btn" onclick="'+clearFn+'()">&#10005; Clear</button>':'')
    +'</div>'
    +'<div class="search-hint">'+hint+'</div>';
}

function matchesSearch(q,by,proj,unit){
  if(!q)return true;
  if((by==='project'||by==='all')&&proj.name.toLowerCase().includes(q))return true;
  if((by==='client'||by==='all')&&(proj.client||'').toLowerCase().includes(q))return true;
  if(unit&&(by==='unit'||by==='all')&&unit.name.toLowerCase().includes(q))return true;
  return false;
}

// ================================================================
// TOAST
// ================================================================
function toast(msg,isErr){
  var wrap=document.getElementById('toast-wrap');
  var el=document.createElement('div');el.className='toast'+(isErr?' err':'');
  el.innerHTML='<span style="color:'+(isErr?'#F09595':'#6fcf97')+'">&#10003;</span>'+msg;
  wrap.appendChild(el);
  setTimeout(function(){el.classList.add('out');setTimeout(function(){el.remove();},320);},2200);
}

// ================================================================
// GOOGLE SHEETS AUTH
// ================================================================
var GS={key:null,token:null,tokenExp:0};
var BASE='https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID;

function b64url(str){return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function ab2b64url(buf){var bytes=new Uint8Array(buf),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

async function getAccessToken(){
  if(GS.token&&Date.now()<GS.tokenExp-60000)return GS.token;
  var k=GS.key,now=Math.floor(Date.now()/1000);
  var header=b64url(JSON.stringify({alg:'RS256',typ:'JWT'}));
  var claim=b64url(JSON.stringify({iss:k.client_email,scope:'https://www.googleapis.com/auth/spreadsheets',aud:k.token_uri,exp:now+3600,iat:now}));
  var sigInput=header+'.'+claim;
  var pemBody=k.private_key.replace(/-----[^-]+-----/g,'').replace(/\s/g,'');
  var binaryDer=Uint8Array.from(atob(pemBody),function(c){return c.charCodeAt(0);});
  var cryptoKey=await crypto.subtle.importKey('pkcs8',binaryDer.buffer,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
  var sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',cryptoKey,new TextEncoder().encode(sigInput));
  var jwt=sigInput+'.'+ab2b64url(sig);
  var resp=await fetch(k.token_uri,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion='+jwt});
  var data=await resp.json();
  if(!data.access_token)throw new Error('Auth failed: '+(data.error_description||data.error||JSON.stringify(data)));
  GS.token=data.access_token;GS.tokenExp=Date.now()+3600000;
  return GS.token;
}

async function sheetsGet(range){var tok=await getAccessToken();var r=await fetch(BASE+'/values/'+encodeURIComponent(range),{headers:{Authorization:'Bearer '+tok}});var d=await r.json();if(d.error)throw new Error(d.error.message);return d.values||[];}
async function sheetsClear(range){var tok=await getAccessToken();await fetch(BASE+'/values/'+encodeURIComponent(range)+':clear',{method:'POST',headers:{Authorization:'Bearer '+tok}});}
async function sheetsWrite(range,values){var tok=await getAccessToken();var r=await fetch(BASE+'/values/'+encodeURIComponent(range)+'?valueInputOption=RAW',{method:'PUT',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({range:range,majorDimension:'ROWS',values:values})});var d=await r.json();if(d.error)throw new Error(d.error.message);}

// ================================================================
// LOAD / SAVE
// ================================================================
async function loadFromSheets(){
  setSyncState('syncing','Loading from Google Sheets...');
  try{
    var projRows=await sheetsGet('Projects!A2:G500');
    var unitRows=await sheetsGet('Units!A2:G500');
    var stageRows=await sheetsGet('Stages!A2:G500');
    if(!projRows||!projRows.length){await seedDefaultData();return;}
    S.projects=projRows.filter(function(r){return r&&r[0];}).map(function(r){
      return{id:r[0],name:r[1]||'',client:r[2]||'',install:r[3]||'',color:r[4]||PCOLS[0],archived:r[5]==='true',priority:r[6]||'medium',units:[]};
    });
    unitRows.filter(function(r){return r&&r[0];}).forEach(function(r){
      var proj=S.projects.find(function(p){return p.id===r[1];});
      if(proj)proj.units.push({id:r[0],projectId:r[1],name:r[2]||'',lead:r[3]||'d1',priority:r[4]||'medium',revs:parseInt(r[5])||0,archived:r[6]==='true',stages:[]});
    });
    stageRows.filter(function(r){return r&&r[0];}).forEach(function(r){
      var unit=null;
      S.projects.forEach(function(p){p.units.forEach(function(u){if(u.id===r[1])unit=u;});});
      if(unit)unit.stages.push({id:r[2],status:r[3]||'todo',designer:r[4]||'d1',start:r[5]||'',end:r[6]||'',note:r[7]||''});
    });
    setSyncState('ok','Loaded from Google Sheets');
    renderApp();
  }catch(e){
    setSyncState('err','Load failed: '+e.message);
    toast('Failed to load: '+e.message,true);
    console.error('Load error:',e);
  }
}

async function saveToSheets(){
  setSyncState('syncing','Saving...');
  try{
    var projRows=[['id','name','client','install','color','archived','priority']];
    var unitRows=[['id','projectId','name','lead','priority','revs','archived']];
    var stageRows=[['id','unitId','stageId','status','designer','start','end','note']];
    S.projects.forEach(function(p){
      projRows.push([
        String(p.id||''),String(p.name||''),String(p.client||''),
        String(p.install||''),String(p.color||PCOLS[0]),
        p.archived===true?'true':'false',
        String(p.priority||'medium')
      ]);
      p.units.forEach(function(u){
        unitRows.push([
          String(u.id||''),String(p.id||''),String(u.name||''),
          String(u.lead||'d1'),String(u.priority||'medium'),
          String(u.revs||0),u.archived===true?'true':'false'
        ]);
        u.stages.forEach(function(st){
          stageRows.push([
            String(st.id||''),String(u.id||''),String(st.id||''),
            String(st.status||'todo'),String(st.designer||'d1'),
            String(st.start||''),String(st.end||''),String(st.note||'')
          ]);
        });
      });
    });
    await sheetsClear('Projects!A1:Z1000');
    await sheetsClear('Units!A1:Z1000');
    await sheetsClear('Stages!A1:Z1000');
    await sheetsWrite('Projects!A1',projRows);
    await sheetsWrite('Units!A1',unitRows);
    await sheetsWrite('Stages!A1',stageRows);
    setSyncState('ok','Saved to Google Sheets \u2713');
    toast('Saved to Google Sheets');
  }catch(e){setSyncState('err','Save failed');toast('Save failed: '+e.message,true);console.error('Save error:',e);}
}

async function seedDefaultData(){
  var t=nextWorkday(todayStr());
  var pA=mkProj('Project A','Client Alpha',addWorkdays(t,45));
  var uA1=mkUnit('Unit 01 \u2014 North Facade','d1',2,t,'high');uA1.stages.find(function(s){return s.id==='fp';}).status='done';
  pA.units.push(uA1,mkUnit('Unit 02 \u2014 South Facade','d2',1,addWorkdays(t,2),'medium'),mkUnit('Unit 03 \u2014 Lobby','d3',2,addWorkdays(t,4),'low'));
  var pB=mkProj('Project B','Client Beta',addWorkdays(t,60));
  pB.units.push(mkUnit('Unit 01 \u2014 East Wing','d4',2,t,'high'),mkUnit('Unit 02 \u2014 West Wing','d5',1,addWorkdays(t,3),'medium'));
  var pC=mkProj('Project C','ABC Company','2026-06-25');
  var uC1=mkUnit('Unit 01','d6',1,t,'medium'),uC2=mkUnit('Unit 02','d6',1,addWorkdays(t,2),'medium');
  uC1.stages.find(function(s){return s.id==='fp';}).status='done';
  uC2.stages.find(function(s){return s.id==='fp';}).status='done';
  pC.units.push(uC1,uC2);

  pD.units.push(mkUnit('Unit 04','d1',2,t,'high'),mkUnit('Unit 05','d1',0,addWorkdays(t,2),'high'));
  S.projects=[pA,pB,pC,pD];
  await saveToSheets();
  renderApp();
}

function setSyncState(state,msg){

  if(!bar)return;
  var dot=bar.querySelector('.sync-dot'),txt=bar.querySelector('.sync-txt');

var pidCtr=1;
var S={tab:'projects',projects:[],col:{},modal:null,confirm:null,search:'',searchBy:'all',archiveSearch:'',archiveSearchBy:'all'};

function makeStages(lead,revs,start){
  var ids=['fp'];for(var i=0;i<revs;i++)ids.push('rv'+(i+1));ids.push('dd');
  var cur=nextWorkday(start||todayStr());
  return ids.map(function(id){var def=getStageDef(id),s=cur,e=addWorkdays(cur,def.days-1);cur=addWorkdays(e,1);return{id:id,status:'todo',designer:lead,start:s,end:e,note:''};});
}
function mkUnit(name,lead,revs,start,pri){return{id:mkId(),name:name,lead:lead,priority:pri||'medium',revs:revs||0,archived:false,stages:makeStages(lead,revs||0,start)};}
function mkProj(name,client,install){
  var c=PCOLS[(pidCtr++-1)%PCOLS.length];
  return{id:mkId(),name:name,client:client,install:nextWorkday(install),archived:false,priority:'medium',units:[],color:c};
}

function unitPct(u){return u.stages.length?Math.round(u.stages.filter(function(s){return s.status==='done';}).length/u.stages.length*100):0;}
function projPct(p){var active=p.units.filter(function(u){return!u.archived;});if(!active.length)return 0;return Math.round(active.reduce(function(a,u){return a+unitPct(u);},0)/active.length);}
function nextStageEnd(u){var s=u.stages.find(function(s){return s.status==='wip';})||u.stages.find(function(s){return s.status==='todo';});return s?s.end:'9999';}
function isUnitComplete(u){return u.stages.length>0&&u.stages.every(function(s){return s.status==='done';});}
function isProjComplete(p){return p.units.length>0&&p.units.every(function(u){return isUnitComplete(u)||u.archived;});}
function canArchiveUnit(u){return!u.archived&&isUnitComplete(u);}
function canArchiveProj(p){return!p.archived&&isProjComplete(p);}

function sortedActiveProjs(){
  return S.projects.filter(function(p){return!p.archived;}).sort(function(a,b){
    var pd=PROJ_PRI_ORDER[a.priority||'medium']-PROJ_PRI_ORDER[b.priority||'medium'];
    if(pd!==0)return pd;
    return a.install<b.install?-1:a.install>b.install?1:0;
  });
}

window.connectKey=async function(){
  var raw=document.getElementById('key-input').value.trim();
  var errEl=document.getElementById('key-err');errEl.style.display='none';
  try{
    var parsed=JSON.parse(raw);
    if(!parsed.private_key||!parsed.client_email||!parsed.token_uri)throw new Error('Invalid key format');
    GS.key=parsed;
    localStorage.setItem('gsheet_key',JSON.stringify(parsed));
    await loadFromSheets();
  }catch(e){errEl.textContent='Error: '+e.message;errEl.style.display='block';}
};

  var activeProjs=sortedActiveProjs();
  var allU=activeProjs.reduce(function(a,p){return a.concat(p.units.filter(function(u){return!u.archived;}));},[]);
  var allSt=allU.reduce(function(a,u){return a.concat(u.stages);},[]);
  var dp=allSt.length?Math.round(allSt.filter(function(s){return s.status==='done';}).length/allSt.length*100):0;
  var hi=allU.filter(function(u){return u.priority==='high';}).length;
  var q=(S.search||'').toLowerCase().trim(),by=S.searchBy||'all';
  var filtered=activeProjs.filter(function(p){
    if(!q)return true;
    if(matchesSearch(q,by,p,null))return true;
    if((by==='unit'||by==='all')&&p.units.filter(function(u){return!u.archived;}).some(function(u){return u.name.toLowerCase().includes(q);}))return true;
    return false;
  });

    +S.projects.filter(function(p){return!p.archived;}).reduce(function(n,p){return n+p.units.filter(function(u){return u.archived;}).length;},0);

// ================================================================
// OVERDUE VIEW
// ================================================================
function viewOverdue(){
  var today=todayStr();
  var overdue=[];
  S.projects.filter(function(p){return!p.archived;}).forEach(function(proj){
    proj.units.filter(function(u){return!u.archived;}).forEach(function(unit){
      unit.stages.forEach(function(stage){
        if(stage.status!=='done'&&stage.end<today){
          var daysLate=Math.round((str2date(today)-str2date(stage.end))/864e5);
          overdue.push({proj:proj,unit:unit,stage:stage,daysLate:daysLate});
        }
      });
    });
  });

  // Sort by most overdue first
  overdue.sort(function(a,b){return b.daysLate-a.daysLate;});

  // Group by project
  var byProj={};var projOrder=[];
  overdue.forEach(function(item){
    if(!byProj[item.proj.id]){byProj[item.proj.id]=[];projOrder.push(item.proj);}
    byProj[item.proj.id].push(item);
  });

  // Summary metrics
  var totalOverdue=overdue.length;
  var affectedProjs=projOrder.length;
  var maxDays=overdue.length?overdue[0].daysLate:0;
  var affectedDesigners=new Set(overdue.map(function(i){return i.stage.designer;})).size;

  function severityColor(days){return days>=14?'var(--red-mid)':days>=7?'var(--amber-mid)':'var(--gray)';}
  function severityBg(days){return days>=14?'var(--red-lt)':days>=7?'var(--amber-lt)':'var(--gray-lt)';}

  var content='';
  if(!totalOverdue){
    content='<div style="text-align:center;padding:4rem;color:var(--hint)">'
      +'<div style="font-size:48px">&#9989;</div>'
      +'<p style="margin-top:1rem;font-size:16px;font-weight:500">No overdue stages</p>'
      +'<p style="font-size:13px;margin-top:6px">All active stages are on track</p>'
      +'</div>';
  } else {
    projOrder.forEach(function(proj){
      var items=byProj[proj.id];
      content+='<div class="proj-card" style="margin-bottom:16px">'
        +'<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fafaf9;border-bottom:1px solid var(--border)">'
        +'<div class="color-bar" style="background:'+proj.color+'"></div>'
        +'<div style="flex:1"><div class="proj-name">'+proj.name+'</div>'
        +'<div class="proj-meta">'+(proj.client||'&mdash;')+' &middot; Install '+fmtDate(proj.install)+'</div></div>'
        +'<span class="badge '+projPriBadge(proj.priority||'medium')+'">'+projPriLabel(proj.priority||'medium')+'</span>'
        +'<span style="font-size:12px;color:var(--red-mid);font-weight:500">'+items.length+' overdue stage'+(items.length!==1?'s':'')+'</span>'
        +'</div>'
        +'<table class="stage-tbl"><thead><tr>'
        +'<th style="width:100px">Unit</th>'
        +'<th style="width:150px">Stage</th>'
        +'<th>Designer</th>'
        +'<th style="width:100px">Was due</th>'
        +'<th style="width:110px">Days late</th>'
        +'<th style="width:130px">Status</th>'
        +'<th style="width:180px">Note</th>'
        +'<th style="width:36px"></th>'
        +'</tr></thead><tbody>'
        +items.map(function(item){
          var des=getDesigner(item.stage.designer);
          var lateBg=severityBg(item.daysLate);
          var lateColor=severityColor(item.daysLate);
          var noteCell=item.stage.note
            ?'<span style="font-size:11px;color:var(--amber);background:var(--amber-lt);border-radius:4px;padding:2px 6px;display:inline-block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+item.stage.note.replace(/"/g,'&quot;')+'">'+item.stage.note+'</span>'
            :'<span style="font-size:11px;color:var(--hint)">—</span>';
          return '<tr style="background:'+lateBg+'">'
            +'<td style="font-size:12px;font-weight:500">'+item.unit.name+'</td>'
            +'<td><span class="badge '+stageBadge(item.stage.id)+'">'+getStageDef(item.stage.id).lbl+'</span></td>'
            +'<td><div style="display:flex;align-items:center;gap:6px">'+avHtml(des)+'<span style="font-size:12px">'+des.name+'</span></div></td>'
            +'<td style="font-size:12px;color:var(--muted)">'+fmtDate(item.stage.end)+'</td>'
            +'<td><span style="font-size:12px;font-weight:600;color:'+lateColor+'">'+item.daysLate+'d late</span></td>'
            +'<td><select class="cell-sel" onchange="chSt(\''+item.proj.id+'\',\''+item.unit.id+'\',\''+item.stage.id+'\',this.value)">'
            +'<option value="todo"'+(item.stage.status==='todo'?' selected':'')+'>To do</option>'
            +'<option value="wip"'+(item.stage.status==='wip'?' selected':'')+'>In progress</option>'
            +'<option value="done"'+(item.stage.status==='done'?' selected':'')+'>Done</option>'
            +'</select></td>'
            +'<td>'+noteCell+'</td>'
            +'<td><button class="icon-btn" onclick="openModal(\'edit-stage\',\''+item.proj.id+'\',\''+item.unit.id+'\',\''+item.stage.id+'\')" title="Edit dates &amp; note">&#9998;</button></td>'
            +'</tr>';
        }).join('')
        +'</tbody></table></div>';
    });
  }

  return '<div class="topbar"><div>'
    +'<div class="topbar-title" style="color:var(--red-mid)">&#9888; Overdue tracker</div>'
    +'<div class="topbar-meta">Stages past their end date and not yet marked Done</div>'
    +'</div></div>'
    +'<div class="content">'
    +(totalOverdue?'<div class="metrics">'
      +'<div class="metric"><div class="metric-val" style="color:var(--red-mid)">'+totalOverdue+'</div><div class="metric-lbl">Overdue stages</div></div>'
      +'<div class="metric"><div class="metric-val">'+affectedProjs+'</div><div class="metric-lbl">Projects affected</div></div>'
      +'<div class="metric"><div class="metric-val">'+affectedDesigners+'</div><div class="metric-lbl">Designers affected</div></div>'
      +'<div class="metric"><div class="metric-val" style="color:var(--red-mid)">'+maxDays+'d</div><div class="metric-lbl">Most days late</div></div>'
      +'</div>'
      +'<div style="background:var(--red-lt);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:flex;align-items:center;gap:8px">'
      +'&#9888; Update stage status or adjust end dates to resolve overdue items. Sorted by most days late first.'
      +'</div>':'')
    +content+'</div>';
}

function viewArchive(){
  var q=(S.archiveSearch||'').toLowerCase().trim();
  var by=S.archiveSearchBy||'all';

  function unitMatchesSearch(proj,unit){
    if(!q)return true;
    if((by==='project'||by==='all')&&proj.name.toLowerCase().includes(q))return true;
    if((by==='client'||by==='all')&&(proj.client||'').toLowerCase().includes(q))return true;
    if((by==='unit'||by==='all')&&unit.name.toLowerCase().includes(q))return true;
    return false;
  }

  var archivedProjs=S.projects.filter(function(p){
    if(!p.archived)return false;
    if(!q)return true;
    if((by==='project'||by==='all')&&p.name.toLowerCase().includes(q))return true;
    if((by==='client'||by==='all')&&(p.client||'').toLowerCase().includes(q))return true;
    if((by==='unit'||by==='all')&&p.units.some(function(u){return u.name.toLowerCase().includes(q);}))return true;
    return false;
  });

  var partialProjs=S.projects.filter(function(p){
    if(p.archived)return false;
    return p.units.some(function(u){return u.archived&&unitMatchesSearch(p,u);});
  });

  var totalArchived=S.projects.filter(function(p){return p.archived;}).length
    +S.projects.filter(function(p){return!p.archived;}).reduce(function(n,p){return n+p.units.filter(function(u){return u.archived;}).length;},0);

  function renderArchUnit(proj,unit){
    var lead=getDesigner(unit.lead);
    var hl=q&&(by==='unit'||by==='all')&&unit.name.toLowerCase().includes(q);
    return '<div class="archive-unit-row" style="background:'+(hl?'#EAF3DE':'#fafaf9')+';'+(hl?'border-left:3px solid var(--green-mid)':'')+'">'
      +avHtml(lead)
      +'<div style="flex:1"><div style="font-size:13px;font-weight:500">'+unit.name+'</div>'
      +'<div style="font-size:11px;color:var(--muted)">Lead: '+lead.name+' &middot; '+unit.stages.length+' stages &middot; '+proj.name+'</div></div>'
      +'<span class="badge b-done" style="margin-right:8px">&#10003; Complete</span>'
      +'<button class="btn" onclick="unarchiveUnit(\''+proj.id+'\',\''+unit.id+'\')" title="Restore">&#8635; Restore</button>'
      +'</div>';
  }

  function renderArchProj(proj){
    var hl=q&&(by==='project'||by==='all')&&proj.name.toLowerCase().includes(q);
    return '<div class="proj-card" style="opacity:.92;'+(hl?'border:1.5px solid var(--green-mid)':'')+'">'
      +'<div style="display:flex;align-items:center;gap:12px;padding:14px 20px;">'
      +'<div class="color-bar" style="background:'+proj.color+'"></div>'
      +'<div style="flex:1"><div class="proj-name">'+proj.name+'</div>'
      +'<div class="proj-meta">'+(proj.client||'&mdash;')+' &middot; '+proj.units.length+' unit'+(proj.units.length!==1?'s':'')+' &middot; Install '+fmtDate(proj.install)+'</div></div>'
      +'<span class="badge b-done" style="margin-right:8px">&#10003; Archived</span>'
      +'<button class="btn" onclick="unarchiveProj(\''+proj.id+'\')" title="Restore project">&#8635; Restore project</button>'
      +'</div>'
      +'<div style="border-top:1px solid var(--border)">'
      +proj.units.map(function(u){return renderArchUnit(proj,u);}).join('')
      +'</div></div>';
  }

  function renderPartialProj(proj){
    var matchedUnits=proj.units.filter(function(u){return u.archived&&unitMatchesSearch(proj,u);});
    if(!matchedUnits.length)return'';
    return '<div class="proj-card">'
      +'<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fafaf9;">'
      +'<div class="color-bar" style="background:'+proj.color+'"></div>'
      +'<div style="flex:1"><div class="proj-name">'+proj.name+'</div>'
      +'<div class="proj-meta">'+(proj.client||'&mdash;')+' &middot; '+matchedUnits.length+' of '+proj.units.length+' units archived</div></div>'
      +'</div>'
      +'<div style="border-top:1px solid var(--border)">'
      +matchedUnits.map(function(u){return renderArchUnit(proj,u);}).join('')
      +'</div></div>';
  }

  var hint=q?'Searching <strong>'+(by==='all'?'all fields':by+' names')+'</strong> for "<strong>'+q+'</strong>"':'';

  var content='';
  if(!archivedProjs.length&&!partialProjs.length){
    content=q
      ?'<div style="text-align:center;padding:3rem;color:var(--hint)">No archived items match "<strong>'+q+'</strong>"</div>'
      :'<div style="text-align:center;padding:4rem;color:var(--hint)"><div style="font-size:48px">&#128451;</div><p style="margin-top:1rem;font-size:15px">No archived projects yet</p><p style="font-size:13px;margin-top:6px">Units and projects appear here when all their stages are marked Done</p></div>';
  } else {
    if(archivedProjs.length){
      content+='<div class="archive-sec-title">&#9989; Completed projects ('+archivedProjs.length+')</div>';
      content+=archivedProjs.map(renderArchProj).join('');
    }
    if(partialProjs.length){
      var partialHTML=partialProjs.map(renderPartialProj).join('');
      if(partialHTML){
        if(archivedProjs.length)content+='<div style="margin-top:24px"></div>';
        content+='<div class="archive-sec-title">&#128196; Partially completed ('+partialProjs.length+')</div>';
        content+=partialHTML;
      }
    }
  }

  return '<div class="topbar"><div><div class="topbar-title">Archive</div>'
    +'<div class="topbar-meta">'+totalArchived+' item'+(totalArchived!==1?'s':'')+' archived</div></div></div>'
    +'<div class="content">'
    +'<div style="margin-bottom:16px">'
    +buildSearchBar('archive-search',q,by,'doArchiveSearch','clearArchiveSearch','setArchiveSearchBy',hint)
    +'</div>'
    +content+'</div>';
}

// ================================================================
// WORKLOAD VIEW
// ================================================================
function viewWorkload(){
  var days=getWorkdays14();
  var allU=S.projects.filter(function(p){return!p.archived;}).reduce(function(a,p){return a.concat(p.units.filter(function(u){return!u.archived;}));},[]);
  var allSt=allU.reduce(function(a,u){return a.concat(u.stages);},[]);
  var dp=allSt.length?Math.round(allSt.filter(function(s){return s.status==='done';}).length/allSt.length*100):0;
  function load(desId,dateStr){var n=0;allU.forEach(function(u){u.stages.forEach(function(s){if(s.designer===desId&&s.status!=='done'&&dateStr>=s.start&&dateStr<=s.end)n++;});});return n;}
  var overloaded=days.some(function(d){return DESIGNERS.some(function(dd){return load(dd.id,d)>=3;});});
  var hdrCells=days.map(function(d,i){var dow=str2date(d).getDay(),dn=DOW[dow],isMon=dn==='Mon'&&i>0,isTd=d===todayStr();return'<th style="'+(isMon?'border-left:2px solid var(--border)':'')+'">'+(isTd?'<span style="color:var(--blue-mid)">'+dn+'</span>':dn)+'<br><span style="font-weight:400;font-size:10px">'+fmtDate(d)+'</span></th>';}).join('');
  var desRows=DESIGNERS.map(function(dd){
    var loads=days.map(function(d){return load(dd.id,d);});
    var sum=0;loads.forEach(function(n){sum+=n;});
    var avg=(sum/loads.length).toFixed(1);
    var cells=loads.map(function(n,i){var dow=str2date(days[i]).getDay(),dn=DOW[dow],isMon=dn==='Mon'&&i>0,cls=n===0?'h0':n===1?'h1':n===2?'h2':'h3';return'<td style="'+(isMon?'border-left:2px solid var(--border)':'')+'"><div class="hcell '+cls+'">'+(n===0?'&mdash;':n)+'</div></td>';}).join('');
    return'<tr><td class="dc"><div style="display:flex;align-items:center;gap:8px">'+avHtml(dd)+'<span>'+dd.name+'</span></div></td>'+cells+'<td style="text-align:center;font-size:12px;color:var(--muted);font-weight:500">'+avg+'</td></tr>';
  }).join('');
  var totals=days.map(function(d){var n=0;DESIGNERS.forEach(function(dd){n+=load(dd.id,d);});return n;});
  var tsum=0;totals.forEach(function(n){tsum+=n;});
  var tAvg=(tsum/totals.length).toFixed(1);
  var totCells=totals.map(function(n,i){var dow=str2date(days[i]).getDay(),dn=DOW[dow],isMon=dn==='Mon'&&i>0;return'<td style="'+(isMon?'border-left:2px solid var(--border);':'')+' text-align:center;font-size:12px;font-weight:600;color:var(--muted)">'+(n===0?'&mdash;':n)+'</td>';}).join('');
  var allPairs=[];
  S.projects.filter(function(p){return!p.archived;}).forEach(function(proj){proj.units.filter(function(u){return!u.archived;}).forEach(function(u){allPairs.push({u:u,proj:proj});});});
  allPairs.sort(function(a,b){var d=PRI_ORDER[a.u.priority]-PRI_ORDER[b.u.priority];return d!==0?d:nextStageEnd(a.u)<nextStageEnd(b.u)?-1:1;});
  var sumRows=allPairs.map(function(item){
    var u=item.u,proj=item.proj,lead=getDesigner(u.lead),pct=unitPct(u);
    var active=u.stages.find(function(s){return s.status==='wip';})||u.stages.find(function(s){return s.status==='todo';});
    var dl=daysToDate(proj.install),dlc=dl<0?'var(--red-mid)':dl<=14?'var(--amber-mid)':'var(--green-mid)';
    return'<tr><td style="font-weight:500">'+u.name+'</td><td style="color:var(--muted)">'+proj.name+'</td>'
    +'<td><span class="badge '+priBadge(u.priority)+'">'+priLabel(u.priority)+'</span></td>'
    +'<td><div style="display:flex;align-items:center;gap:6px">'+avHtml(lead)+'<span>'+lead.name+'</span></div></td>'
    +'<td style="font-size:12px;font-weight:500;color:'+dlc+'">'+fmtDate(proj.install)+'</td>'
    +'<td>'+(active?'<span class="badge '+stageBadge(active.id)+'">'+getStageDef(active.id).lbl+'</span>':'<span class="badge b-done">Complete</span>')+'</td>'
    +'<td><div style="display:flex;align-items:center;gap:8px"><div style="width:64px"><div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div></div><span style="font-size:12px;color:var(--muted)">'+pct+'%</span></div></td></tr>';
  }).join('');
  return'<div class="topbar"><div><div class="topbar-title">Team workload</div><div class="topbar-meta">'+fmtDateY(todayStr())+'</div></div></div>'
  +'<div class="content"><div class="metrics">'
  +'<div class="metric"><div class="metric-val">'+S.projects.filter(function(p){return!p.archived;}).length+'</div><div class="metric-lbl">Active projects</div></div>'
  +'<div class="metric"><div class="metric-val">'+allU.length+'</div><div class="metric-lbl">Active units</div></div>'
  +'<div class="metric"><div class="metric-val">'+allU.filter(function(u){return unitPct(u)<100;}).length+'</div><div class="metric-lbl">In progress</div></div>'
  +'<div class="metric"><div class="metric-val">'+dp+'%</div><div class="metric-lbl">Stages done</div></div>'
  +'</div>'
  +(overloaded?'<div class="alert-bar">&#9888; One or more designers are overloaded in the next 14 days</div>':'')
  +'<div class="hm-wrap"><div class="hm-hd"><span style="font-size:14px;font-weight:500">Daily workload</span><span style="font-size:12px;color:var(--muted)">Next 14 working days &mdash; Mon to Fri, excl. bank holidays</span></div>'
  +'<div class="hm-scroll"><table class="hm-tbl"><thead><tr><th class="dc">Designer</th>'+hdrCells+'<th style="text-align:center;min-width:48px">Avg</th></tr></thead>'
  +'<tbody>'+desRows+'<tr class="tot-row"><td class="dc">Team total</td>'+totCells+'<td style="text-align:center;font-size:12px">'+tAvg+'</td></tr></tbody></table></div>'
  +'<div class="legend"><span style="font-size:11px;color:var(--muted)">Load key:</span>'
  +'<span class="legend-item"><span class="ldot" style="background:#f5f5f3;border:1px solid #ddd"></span>Free</span>'
  +'<span class="legend-item"><span class="ldot" style="background:#D4EBBF"></span>1 light</span>'
  +'<span class="legend-item"><span class="ldot" style="background:#FAC775"></span>2 moderate</span>'
  +'<span class="legend-item"><span class="ldot" style="background:#F09595"></span>3+ overloaded</span>'
  +'</div></div>'
  +'<div class="sum-card"><div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500">All active units &mdash; by priority</div>'
  +'<div style="overflow-x:auto"><table class="sum-tbl"><thead><tr><th>Unit</th><th>Project</th><th>Priority</th><th>Lead</th><th>Install</th><th>Active stage</th><th>Progress</th></tr></thead>'
  +'<tbody>'+sumRows+'</tbody></table></div></div></div>';
}

// ================================================================
// GANTT HELPERS
// ================================================================
var GDW=28,GRH=30,GLW=200,GHH=52,GGAP=6;
function ganttWeekGroups(days){var w=[],wk=[];days.forEach(function(day){var dow=str2date(day).getDay();if(dow===1&&wk.length){w.push(wk);wk=[];}wk.push(day);});if(wk.length)w.push(wk);return w;}
function isCritical(st,unit,proj){return Math.round((str2date(proj.install)-str2date(st.end))/864e5)<=7||unit.priority==='high';}
function barColors(st,crit,done){if(done)return{f:'#C8E6C9',s:'#81C784'};if(crit)return{f:'#FFCDD2',s:'#E24B4A'};if(st.id==='fp')return{f:'#BBDEFB',s:'#378ADD'};if(st.id.startsWith('rv'))return{f:'#FFE0B2',s:'#BA7517'};return{f:'#C8E6C9',s:'#639922'};}
function buildBar(days,st,unit,proj,rowY,barH,clipId){
  var si=days.indexOf(st.start);if(si<0)si=0;var ei=days.indexOf(st.end);if(ei<0)ei=days.length-1;if(si>days.length-1)return'';
  var bx=GLW+si*GDW+2,bw=Math.max(GDW-4,(ei-si+1)*GDW-4),by=rowY+4;
  var crit=isCritical(st,unit,proj),done=st.status==='done',wip=st.status==='wip';
  var col=barColors(st,crit,done);var des=getDesigner(st.designer);
  var tip=getStageDef(st.id).lbl+' - '+des.name+' | '+fmtDate(st.start)+' to '+fmtDate(st.end)+(crit?' | Critical':'')+(done?' | Done':wip?' | In progress':'');
  var o='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+barH+'" rx="3" fill="'+col.f+'" stroke="'+col.s+'" stroke-width="1.5"><title>'+tip+'</title></rect>';
  if(crit&&!done)o+='<text x="'+(bx+3)+'" y="'+(by+barH-3)+'" font-size="9" fill="#E24B4A">!</text>';
  if(done)o+='<text x="'+(bx+bw/2)+'" y="'+(by+barH-3)+'" text-anchor="middle" font-size="9" fill="#27500A">&#10003;</text>';
  if(wip&&!done)o+='<circle cx="'+(bx+bw-6)+'" cy="'+(by+barH/2)+'" r="3" fill="'+col.s+'"/>';
  if(bw>40)o+='<text x="'+(bx+5)+'" y="'+(by+barH/2+3)+'" font-size="8" fill="'+(done?'#27500A':crit?'#791F1F':'#444')+'" clip-path="url(#'+clipId+')">'+getStageDef(st.id).lbl.slice(0,9)+'</text>';
  return o;
}
function buildGanttChrome(days,weeks,totalW,totalH){
  var wb='',wx=GLW;
  weeks.forEach(function(wk,wi){var bw=wk.length*GDW,lbl=str2date(wk[0]).toLocaleDateString('en-GB',{day:'numeric',month:'short'});wb+='<rect x="'+wx+'" y="0" width="'+bw+'" height="'+GHH+'" fill="'+(wi%2===0?'#f8f8f7':'#f0f0ee')+'"/><text x="'+(wx+bw/2)+'" y="14" text-anchor="middle" font-size="10" fill="#888">'+lbl+'</text>';wx+=bw;});
  var dl='',gl='';
  days.forEach(function(day,i){var x=GLW+i*GDW,dow=str2date(day).getDay(),dn=DOW[dow].slice(0,1),isMon=dow===1&&i>0,isTd=day===todayStr();dl+='<text x="'+(x+GDW/2)+'" y="'+(GHH-8)+'" text-anchor="middle" font-size="9" fill="'+(isTd?'#378ADD':'#aaa')+'" font-weight="'+(isTd?'700':'400')+'">'+dn+'</text>';gl+='<line x1="'+x+'" y1="'+GHH+'" x2="'+x+'" y2="'+totalH+'" stroke="'+(isMon?'#ccc':'#eee')+'" stroke-width="'+(isMon?1.5:0.5)+'"/>';});
  var ti=days.indexOf(todayStr()),tl='';
  if(ti>=0){var tx=GLW+ti*GDW+GDW/2;tl='<line x1="'+tx+'" y1="'+GHH+'" x2="'+tx+'" y2="'+totalH+'" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,3"/><rect x="'+(tx-12)+'" y="'+(GHH-1)+'" width="24" height="13" rx="4" fill="#378ADD"/><text x="'+tx+'" y="'+(GHH+9)+'" text-anchor="middle" font-size="8" fill="#fff" font-weight="600">TODAY</text>';}
  return wb+gl+dl+tl;
}

function viewGanttDesigner(){
  var days=getWorkdays8w(nextWorkday(todayStr()));
  var weeks=ganttWeekGroups(days);
  var startDate=days[0],rangeEnd=days[days.length-1];
  var allU=[];
  S.projects.filter(function(p){return!p.archived;}).forEach(function(p){p.units.filter(function(u){return!u.archived;}).forEach(function(u){allU.push({u:u,p:p});});});
  var totalW=GLW+days.length*GDW,totalH=GHH+DESIGNERS.length*(GRH+2)+8;
  var rc='',cd='';
  DESIGNERS.forEach(function(des,ri){
    var y=GHH+ri*(GRH+2),bg=ri%2===0?'#fff':'#fafaf9';
    rc+='<rect x="0" y="'+y+'" width="'+totalW+'" height="'+GRH+'" fill="'+bg+'"/>';
    rc+='<circle cx="20" cy="'+(y+GRH/2)+'" r="10" fill="'+des.bg+'"/><text x="20" y="'+(y+GRH/2+4)+'" text-anchor="middle" font-size="8" font-weight="700" fill="'+des.fg+'">'+des.ini+'</text>';
    rc+='<text x="36" y="'+(y+GRH/2+4)+'" font-size="11" fill="#333">'+des.name+'</text>';
    rc+='<line x1="0" y1="'+(y+GRH+1)+'" x2="'+totalW+'" y2="'+(y+GRH+1)+'" stroke="#eee" stroke-width="0.5"/>';
    cd+='<clipPath id="dg'+ri+'"><rect x="'+GLW+'" y="'+y+'" width="'+(totalW-GLW)+'" height="'+GRH+'"/></clipPath>';
    allU.forEach(function(item){item.u.stages.forEach(function(st){if(st.designer!==des.id)return;if(st.end<startDate||st.start>rangeEnd)return;rc+=buildBar(days,st,item.u,item.p,y,GRH-8,'dg'+ri);});});
    var seen={};
    allU.forEach(function(item){if(seen[item.p.id])return;var hasDes=item.u.stages.some(function(st){return st.designer===des.id;});if(!hasDes)return;seen[item.p.id]=true;var ii=days.indexOf(item.p.install);if(ii<0)return;var ix=GLW+ii*GDW+GDW/2;rc+='<line x1="'+ix+'" y1="'+(y+2)+'" x2="'+ix+'" y2="'+(y+GRH-2)+'" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="3,2"><title>Install: '+item.p.name+' '+fmtDate(item.p.install)+'</title></line>';rc+='<polygon points="'+ix+','+(y+2)+' '+(ix-4)+','+(y+9)+' '+(ix+4)+','+(y+9)+'" fill="#E24B4A"/>';});
  });
  var chrome=buildGanttChrome(days,weeks,totalW,totalH);
  return'<div class="topbar"><div><div class="topbar-title">Gantt \u2014 by designer</div><div class="topbar-meta">Next 8 weeks \u2014 '+fmtDateY(startDate)+' to '+fmtDateY(rangeEnd)+'</div></div></div>'
  +'<div class="content" style="padding:0"><div style="overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 120px)">'
  +'<svg width="'+totalW+'" height="'+totalH+'" style="display:block;font-family:system-ui,sans-serif"><defs>'+cd+'</defs>'+chrome+rc
  +'<line x1="'+GLW+'" y1="0" x2="'+GLW+'" y2="'+totalH+'" stroke="#ddd" stroke-width="1"/>'
  +'<line x1="0" y1="'+GHH+'" x2="'+totalW+'" y2="'+GHH+'" stroke="#ccc" stroke-width="1"/>'
  +'<rect x="0" y="0" width="'+GLW+'" height="'+GHH+'" fill="#f8f8f7"/>'

  +'</svg></div>'+ganttLegend()+'</div>';
}

function viewGanttProject(){
  var days=getWorkdays8w(nextWorkday(todayStr()));
  var weeks=ganttWeekGroups(days);
  var startDate=days[0],rangeEnd=days[days.length-1];
  var activeProjs=S.projects.filter(function(p){return!p.archived;});
  var totalRows=activeProjs.reduce(function(s,p){return s+1+p.units.filter(function(u){return!u.archived;}).length;},0);
  var totalH=GHH+(totalRows*(GRH+2))+GGAP*activeProjs.length+8;
  var totalW=GLW+days.length*GDW;
  var rc='',cd='',ci=0,rowY=GHH+4;
  activeProjs.forEach(function(proj){
    var pc=proj.color;
    var activeUnits=proj.units.filter(function(u){return!u.archived;});
    rc+='<rect x="0" y="'+rowY+'" width="'+totalW+'" height="'+GRH+'" fill="'+pc+'18"/>';
    rc+='<rect x="0" y="'+rowY+'" width="4" height="'+GRH+'" fill="'+pc+'"/>';
    rc+='<text x="12" y="'+(rowY+GRH/2+4)+'" font-size="12" font-weight="700" fill="'+pc+'">'+proj.name+'</text>';
    rc+='<text x="'+(GLW-6)+'" y="'+(rowY+GRH/2+4)+'" text-anchor="end" font-size="10" fill="#888">'+proj.client+'</text>';
    var ii=days.indexOf(proj.install);
    if(ii>=0){var ix=GLW+ii*GDW+GDW/2,ph=activeUnits.length*(GRH+2);rc+='<line x1="'+ix+'" y1="'+rowY+'" x2="'+ix+'" y2="'+(rowY+GRH+ph)+'" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"><title>Install: '+fmtDate(proj.install)+'</title></line>';rc+='<polygon points="'+ix+','+(rowY+2)+' '+(ix-5)+','+(rowY+12)+' '+(ix+5)+','+(rowY+12)+'" fill="#E24B4A" opacity="0.85"/>';if(ii<days.length-4)rc+='<text x="'+(ix+4)+'" y="'+(rowY+14)+'" font-size="8" fill="#E24B4A" font-weight="600">'+fmtDate(proj.install)+'</text>';}
    rowY+=GRH+2;
    var sorted=activeUnits.slice().sort(function(a,b){var diff=PRI_ORDER[a.priority]-PRI_ORDER[b.priority];if(diff!==0)return diff;return nextStageEnd(a)<nextStageEnd(b)?-1:1;});
    sorted.forEach(function(unit,ui){
      var uY=rowY,bg=ui%2===0?'#fff':'#fafaf9',lead=getDesigner(unit.lead);
      rc+='<rect x="0" y="'+uY+'" width="'+totalW+'" height="'+GRH+'" fill="'+bg+'"/>';
      cd+='<clipPath id="pg'+ci+'"><rect x="'+GLW+'" y="'+uY+'" width="'+(totalW-GLW)+'" height="'+GRH+'"/></clipPath>';
      rc+='<rect x="4" y="'+uY+'" width="3" height="'+GRH+'" fill="'+pc+'60"/>';
      rc+='<circle cx="16" cy="'+(uY+GRH/2)+'" r="8" fill="'+lead.bg+'"/><text x="16" y="'+(uY+GRH/2+3)+'" text-anchor="middle" font-size="7" font-weight="700" fill="'+lead.fg+'">'+lead.ini+'</text>';
      var uname=unit.name.length>22?unit.name.slice(0,22)+'...':unit.name;
      rc+='<text x="28" y="'+(uY+GRH/2+4)+'" font-size="10" fill="#333">'+uname+'</text>';
      var priDotColor={high:'#E24B4A',medium:'#BA7517',low:'#639922'}[unit.priority];
      rc+='<circle cx="'+(GLW-8)+'" cy="'+(uY+GRH/2)+'" r="4" fill="'+priDotColor+'" opacity="0.85"><title>Priority: '+priLabel(unit.priority)+'</title></circle>';
      unit.stages.forEach(function(st){if(st.end<startDate||st.start>rangeEnd)return;rc+=buildBar(days,st,unit,proj,uY,GRH-8,'pg'+ci);});
      rc+='<line x1="0" y1="'+(uY+GRH)+'" x2="'+totalW+'" y2="'+(uY+GRH)+'" stroke="#f0f0ee" stroke-width="0.5"/>';
      ci++;rowY+=GRH+2;
    });
    rowY+=GGAP;
  });
  var chrome=buildGanttChrome(days,weeks,totalW,totalH);
  return'<div class="topbar"><div><div class="topbar-title">Gantt \u2014 by project</div><div class="topbar-meta">Next 8 weeks \u2014 '+fmtDateY(startDate)+' to '+fmtDateY(rangeEnd)+'</div></div></div>'
  +'<div class="content" style="padding:0"><div style="overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 120px)">'
  +'<svg width="'+totalW+'" height="'+totalH+'" style="display:block;font-family:system-ui,sans-serif"><defs>'+cd+'</defs>'+chrome+rc
  +'<line x1="'+GLW+'" y1="0" x2="'+GLW+'" y2="'+totalH+'" stroke="#ddd" stroke-width="1"/>'
  +'<line x1="0" y1="'+GHH+'" x2="'+totalW+'" y2="'+GHH+'" stroke="#ccc" stroke-width="1"/>'
  +'<rect x="0" y="0" width="'+GLW+'" height="'+GHH+'" fill="#f8f8f7"/>'
  +'<text x="12" y="30" font-size="11" font-weight="600" fill="#666">Project / Unit</text>'
  +'</svg></div>'+ganttLegend()+'</div>';
}

window.sw=function(t){S.tab=t;render();};
window.togC=function(id){S.col[id]=!S.col[id];render();};
window.openModal=function(type,pid,uid,sid){S.modal={type:type,pid:pid,uid:uid,sid:sid};render();};
window.closeMdl=function(e){if(!e||e.target.classList.contains('modal-bg')){S.modal=null;render();}};
