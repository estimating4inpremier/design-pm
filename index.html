window.doDel=function(){
  var c=S.confirm;
  var lbl=c.type==='project'?S.projects.find(function(p){return p.id===c.pid;}).name:S.projects.find(function(p){return p.id===c.pid;}).units.find(function(u){return u.id===c.uid;}).name;
  if(c.type==='project')S.projects=S.projects.filter(function(p){return p.id!==c.pid;});
  else{var p=S.projects.find(function(p){return p.id===c.pid;});if(p)p.units=p.units.filter(function(u){return u.id!==c.uid;});}
  S.confirm=null;render();saveToSheets();toast('"'+lbl+'" deleted');
};
window.ewdCheck=function(id){
  var el=document.getElementById(id),note=document.getElementById(id+'-note');
  if(!el||!el.value)return;
  var c=nextWorkday(el.value);
  if(c!==el.value){el.value=c;if(note)note.textContent=(BH.has(el.value)?'Bank holiday':'Weekend')+' \u2014 moved to '+fmtDate(c);}
  else if(note)note.textContent='';
};
window.chProjPri=function(projId,val){
  var p=S.projects.find(function(p){return p.id===projId;});
  if(p){p.priority=val;}render();saveToSheets();toast('Project priority updated');
};
window.chPri=function(pid,uid,val){var p=S.projects.find(function(p){return p.id===pid;});if(p){var u=p.units.find(function(u){return u.id===uid;});if(u)u.priority=val;}render();saveToSheets();toast('Priority updated');};
window.chSt=function(pid,uid,sid,val){var p=S.projects.find(function(p){return p.id===pid;});if(p){var u=p.units.find(function(u){return u.id===uid;});if(u){var s=u.stages.find(function(s){return s.id===sid;});if(s)s.status=val;}}render();saveToSheets();toast('Stage status updated');};
window.chDes=function(pid,uid,sid,val){var p=S.projects.find(function(p){return p.id===pid;});if(p){var u=p.units.find(function(u){return u.id===uid;});if(u){var s=u.stages.find(function(s){return s.id===sid;});if(s)s.designer=val;}}render();saveToSheets();toast('Designer reassigned');};
window.addRev=function(projId,unitId){
  var p=S.projects.find(function(p){return p.id===projId;});if(!p)return;
  var u=p.units.find(function(u){return u.id===unitId;});if(!u)return;
  var cur=u.stages.filter(function(s){return s.id.startsWith('rv');}).length;
  if(cur>=3){toast('Maximum 3 revisions allowed',true);return;}
  var newId='rv'+(cur+1),ddIdx=u.stages.findIndex(function(s){return s.id==='dd';}),dd=u.stages[ddIdx];
  var rs=dd.start,re=addWorkdays(rs,getStageDef(newId).days-1),nds=addWorkdays(re,1),nde=addWorkdays(nds,getStageDef('dd').days-1);
  u.stages.splice(ddIdx,0,{id:newId,status:'todo',designer:u.lead,start:rs,end:re});
  dd.start=nds;dd.end=nde;u.revs=cur+1;
  render();saveToSheets();toast('Revision '+(cur+1)+' added');
};
window.archiveUnit=function(projId,unitId){
  var p=S.projects.find(function(p){return p.id===projId;});if(!p)return;
  var u=p.units.find(function(u){return u.id===unitId;});if(!u)return;
  if(!isUnitComplete(u)){toast('All stages must be Done before archiving',true);return;}
  u.archived=true;
  var autoArchived=false;
  if(canArchiveProj(p)){p.archived=true;autoArchived=true;}
  render();saveToSheets();
  toast(autoArchived?'"'+u.name+'" archived \u2014 all units done, project archived too!':'"'+u.name+'" archived successfully');
};
window.unarchiveUnit=function(projId,unitId){
  var p=S.projects.find(function(p){return p.id===projId;});if(!p)return;
  var u=p.units.find(function(u){return u.id===unitId;});if(!u)return;
  u.archived=false;p.archived=false;
  render();saveToSheets();toast('"'+u.name+'" restored to active');
};
window.archiveProj=function(projId){
  var p=S.projects.find(function(p){return p.id===projId;});if(!p)return;
  if(!canArchiveProj(p)){toast('All units must be completed before archiving the project',true);return;}
  p.archived=true;p.units.forEach(function(u){u.archived=true;});
  render();saveToSheets();toast('"'+p.name+'" archived successfully');
};
window.unarchiveProj=function(projId){
  var p=S.projects.find(function(p){return p.id===projId;});if(!p)return;
  p.archived=false;p.units.forEach(function(u){u.archived=false;});
  render();saveToSheets();toast('"'+p.name+'" restored to active');
};
window.saveMdl=function(){
  var m=S.modal;
  if(m.type==='new-project'||m.type==='edit-project'){
    var name=document.getElementById('m-pn').value.trim();if(!name)return;
    var client=document.getElementById('m-pc').value.trim();
    var pri=document.getElementById('m-ppr').value;
    var install=nextWorkday(document.getElementById('m-pi').value);
    if(m.type==='edit-project'){var p=S.projects.find(function(p){return p.id===m.pid;});if(p){p.name=name;p.client=client;p.install=install;p.priority=pri;}S.modal=null;render();saveToSheets();toast('Project updated');}
    else{var np=mkProj(name,client,install);np.priority=pri;S.projects.push(np);S.modal=null;render();saveToSheets();toast('Project created');}
  }else if(m.type==='new-unit'||m.type==='edit-unit'){
    var name=document.getElementById('m-un').value.trim();if(!name)return;
    var lead=document.getElementById('m-ul').value,pri=document.getElementById('m-up').value,start=nextWorkday(document.getElementById('m-us').value);
    var p=S.projects.find(function(p){return p.id===m.pid;});if(!p)return;
    if(m.type==='edit-unit'){var u=p.units.find(function(u){return u.id===m.uid;});if(u){u.name=name;u.lead=lead;u.priority=pri;u.stages=makeStages(lead,u.revs,start);}S.modal=null;render();saveToSheets();toast('Unit updated');}
    else{p.units.push(mkUnit(name,lead,0,start,pri));S.modal=null;render();saveToSheets();toast('Unit added');}
  }else if(m.type==='edit-stage'){
    var p=S.projects.find(function(p){return p.id===m.pid;});
    if(p){var u=p.units.find(function(u){return u.id===m.uid;});if(u){var s=u.stages.find(function(s){return s.id===m.sid;});if(s){s.start=nextWorkday(document.getElementById('e-s').value);s.end=nextWorkday(document.getElementById('e-e').value);s.note=document.getElementById('e-note').value.trim();}}}
    S.modal=null;render();saveToSheets();toast('Stage updated');
  }
};
window.doSearch=function(val){
  S.search=val;var q=val.toLowerCase().trim(),by=S.searchBy||'all';
  var activeProjs=sortedActiveProjs();
  var filtered=activeProjs.filter(function(p){
    if(!q)return true;
    if(matchesSearch(q,by,p,null))return true;
    if((by==='unit'||by==='all')&&p.units.filter(function(u){return!u.archived;}).some(function(u){return u.name.toLowerCase().includes(q);}))return true;
    return false;
  });
  var list=document.getElementById('proj-list');
  if(list)list.innerHTML=filtered.length?filtered.map(renderProjCard).join(''):q?'<div style="text-align:center;padding:2rem;color:var(--hint)">No results</div>':'<p style="color:var(--hint);padding:2rem;text-align:center">No active projects</p>';
  var cnt=document.getElementById('search-count');if(cnt)cnt.innerHTML=q?'Searching <strong>'+(by==='all'?'all fields':by+' names')+'</strong> for "<strong>'+val+'</strong>" &mdash; '+filtered.length+' of '+activeProjs.length+' shown':'';
  var clr=document.getElementById('search-clear');if(clr)clr.style.display=q?'':'none';
};
window.clearSearch=function(){S.search='';var el=document.getElementById('proj-search');if(el)el.value='';doSearch('');};
window.setSearchBy=function(by){S.searchBy=by;render();setTimeout(function(){var el=document.getElementById('proj-search');if(el)el.focus();},0);};
window.doArchiveSearch=function(val){
  S.archiveSearch=val;
  var main=document.getElementById('main');
  if(main&&S.tab==='archive')main.innerHTML=viewArchive();
  setTimeout(function(){var el=document.getElementById('archive-search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);
};
window.clearArchiveSearch=function(){
  S.archiveSearch='';
  var el=document.getElementById('archive-search');if(el)el.value='';
  var main=document.getElementById('main');
  if(main&&S.tab==='archive')main.innerHTML=viewArchive();
};
window.setArchiveSearchBy=function(by){
  S.archiveSearchBy=by;
  var main=document.getElementById('main');
  if(main&&S.tab==='archive')main.innerHTML=viewArchive();
  setTimeout(function(){var el=document.getElementById('archive-search');if(el)el.focus();},0);
};
window.disconnectKey=function(){
  localStorage.removeItem('gsheet_key');
  GS.key=null;GS.token=null;GS.tokenExp=0;S.projects=[];
  renderSetup();toast('Disconnected \u2014 key removed from this device');
};
window.forceSetup=function(){localStorage.removeItem('gsheet_key');GS.key=null;GS.token=null;GS.tokenExp=0;renderSetup();};

// ================================================================
// EXPORT / PRINT
// ================================================================
window.exportReport=function(){
  var today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  var activeProjs=sortedActiveProjs();

  function stageRow(s,isLast){
    var def=getStageDef(s.id),des=getDesigner(s.designer);
    var statusLabel={todo:'To do',wip:'In progress',done:'Done'}[s.status]||s.status;
    var statusColor=s.status==='done'?'#27500A':s.status==='wip'?'#633806':'#444441';
    var statusBg=s.status==='done'?'#EAF3DE':s.status==='wip'?'#FAEEDA':'#F1EFE8';
    return '<tr style="border-bottom:'+(isLast?'none':'1px solid #eee')+';opacity:'+(s.status==='done'?'0.55':'1')+'">'
      +'<td style="padding:7px 10px;font-size:12px;font-weight:500">'+def.lbl+'</td>'
      +'<td style="padding:7px 10px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:'+statusBg+';color:'+statusColor+'">'+statusLabel+'</span></td>'
      +'<td style="padding:7px 10px;font-size:12px;color:#666">'+des.name+'</td>'
      +'<td style="padding:7px 10px;font-size:12px;color:#666">'+fmtDate(s.start)+'</td>'
      +'<td style="padding:7px 10px;font-size:12px;color:#666">'+fmtDate(s.end)+'</td>'
      +'<td style="padding:7px 10px;font-size:11px;color:#BA7517;max-width:180px">'+(s.note?'<span style="background:#FAEEDA;padding:2px 6px;border-radius:3px">'+s.note.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>':'')+'</td>'
      +'</tr>';
  }

  function unitBlock(u){
    var pct=unitPct(u);
    var priColor={high:'#791F1F',medium:'#633806',low:'#27500A'}[u.priority]||'#444';
    var priBg={high:'#FCEBEB',medium:'#FAEEDA',low:'#EAF3DE'}[u.priority]||'#F1EFE8';
    var priLbl={high:'High',medium:'Medium',low:'Low'}[u.priority]||'Medium';
    var active=u.stages.find(function(s){return s.status==='wip';})||u.stages.find(function(s){return s.status==='todo';});
    var activeLbl=active?getStageDef(active.id).lbl:'Complete';
    var lead=getDesigner(u.lead);
    return '<div style="border:1px solid #e5e5e3;border-radius:8px;margin-bottom:12px;overflow:hidden;break-inside:avoid">'
      +'<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fafaf9;border-bottom:1px solid #e5e5e3">'
      +'<div style="flex:1">'
      +'<div style="font-size:13px;font-weight:600;color:#1a1a1a">'+u.name+'</div>'
      +'<div style="font-size:11px;color:#666;margin-top:2px">Lead: '+lead.name+' &middot; Active: '+activeLbl+'</div>'
      +'</div>'
      +'<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:'+priBg+';color:'+priColor+'">'+priLbl+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:#185FA5;background:#E6F1FB;padding:3px 9px;border-radius:4px">'+pct+'%</span>'
      +'</div>'
      +'<table style="width:100%;border-collapse:collapse">'
      +'<thead><tr style="background:#f5f5f3">'
      +'<th style="padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:140px">Stage</th>'
      +'<th style="padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:100px">Status</th>'
      +'<th style="padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:90px">Designer</th>'
      +'<th style="padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:80px">Start</th>'
      +'<th style="padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:80px">End</th>'
      +'<th style="padding:6px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600">Client note</th>'
      +'</tr></thead><tbody>'
      +u.stages.map(function(s,i){return stageRow(s,i===u.stages.length-1);}).join('')
      +'</tbody></table></div>';
  }

  function projBlock(p){
    var pct=projPct(p);
    var activeUnits=p.units.filter(function(u){return!u.archived;});
    var dl=daysToDate(p.install);
    var dlColor=dl<0?'#E24B4A':dl<=14?'#BA7517':'#27500A';
    var dlBg=dl<0?'#FCEBEB':dl<=14?'#FAEEDA':'#EAF3DE';
    var dlText=dl<0?Math.abs(dl)+'d overdue':dl===0?'Due today':dl+'d to install';
    var priLbl={high:'High',medium:'Medium',low:'Low'}[p.priority||'medium']||'Medium';
    var wip=activeUnits.filter(function(u){return!isUnitComplete(u);}).length;
    var done=activeUnits.filter(function(u){return isUnitComplete(u);}).length;
    return '<div style="background:#fff;border:1px solid #e5e5e3;border-radius:12px;margin-bottom:28px;overflow:hidden;break-inside:avoid;page-break-inside:avoid">'
      +'<div style="display:flex;align-items:center;gap:0;border-bottom:1px solid #e5e5e3">'
      +'<div style="width:5px;background:'+p.color+';align-self:stretch"></div>'
      +'<div style="flex:1;padding:14px 18px">'
      +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      +'<div style="font-size:16px;font-weight:700;color:#1a1a1a">'+p.name+'</div>'
      +'<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#E6F1FB;color:#185FA5">'+priLbl+' priority</span>'
      +'<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:'+dlBg+';color:'+dlColor+'">'+dlText+'</span>'
      +'</div>'
      +'<div style="font-size:12px;color:#666;margin-top:4px">'+p.client+' &middot; Install: '+fmtDateY(p.install)+'</div>'
      +'</div>'
      +'<div style="padding:14px 18px;text-align:right;flex-shrink:0">'
      +'<div style="font-size:24px;font-weight:700;color:#185FA5">'+pct+'%</div>'
      +'<div style="font-size:11px;color:#888;margin-top:2px">'+done+' done &middot; '+wip+' in progress</div>'
      +'<div style="width:80px;height:5px;background:#eee;border-radius:3px;margin-top:6px;margin-left:auto"><div style="width:'+pct+'%;height:100%;background:#378ADD;border-radius:3px"></div></div>'
      +'</div></div>'
      +'<div style="padding:14px 18px">'
      +(activeUnits.length?activeUnits.map(function(u){return unitBlock(u);}).join(''):'<p style="color:#aaa;font-size:13px">No active units</p>')
      +'</div></div>';
  }

  // ---- Workload this week ----
  function getThisWeek(){
    var r=[],d=new Date(),dow=d.getDay();
    var mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1));
    for(var i=0;i<5;i++){var dd=new Date(mon);dd.setDate(mon.getDate()+i);var s=date2str(dd);if(!isBlocked(s))r.push(s);}
    return r;
  }
  var weekDays=getThisWeek();
  var weekStart=weekDays.length?fmtDate(weekDays[0]):'';
  var weekEnd=weekDays.length?fmtDate(weekDays[weekDays.length-1]):'';

  function stagesThisWeek(desId){
    var hits=[];
    activeProjs.forEach(function(proj){
      proj.units.filter(function(u){return!u.archived;}).forEach(function(u){
        u.stages.forEach(function(s){
          if(s.designer!==desId||s.status==='done')return;
          if(weekDays.length&&s.start<=weekDays[weekDays.length-1]&&s.end>=weekDays[0])
            hits.push({proj:proj,unit:u,stage:s});
        });
      });
    });
    hits.sort(function(a,b){return(PRI_ORDER[a.unit.priority]||1)-(PRI_ORDER[b.unit.priority]||1)||a.stage.start.localeCompare(b.stage.start);});
    return hits;
  }

  function loadIndicator(n){
    var color=n===0?'#bbb':n===1?'#3A9E5F':n===2?'#BA7517':'#E24B4A';
    var label=n===0?'Free':n===1?'Light':n===2?'Moderate':'Heavy';
    var dots='';for(var i=0;i<Math.min(n,3);i++)dots+='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+color+';margin-right:2px"></span>';
    return '<div style="display:flex;align-items:center;gap:6px">'+dots+'<span style="font-size:11px;color:'+color+';font-weight:600">'+label+'</span></div>';
  }

  var workloadRows=DESIGNERS.map(function(des){
    var hits=stagesThisWeek(des.id);
    var n=hits.length;
    var stageList=hits.map(function(h){
      var priColor={high:'#791F1F',medium:'#633806',low:'#27500A'}[h.unit.priority]||'#444';
      var priBg={high:'#FCEBEB',medium:'#FAEEDA',low:'#EAF3DE'}[h.unit.priority]||'#F1EFE8';
      var priLbl={high:'High',medium:'Med',low:'Low'}[h.unit.priority]||'Med';
      var wipDot=h.stage.status==='wip'?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#378ADD;margin-right:4px;vertical-align:middle"></span>':'';
      return '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f0f0ee">'
        +'<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:'+priBg+';color:'+priColor+';flex-shrink:0">'+priLbl+'</span>'
        +wipDot
        +'<span style="font-size:12px;font-weight:600;color:#1a1a1a">'+h.unit.name+'</span>'
        +'<span style="font-size:11px;color:#888">&mdash;'+h.proj.name+'</span>'
        +'<span style="font-size:10px;color:#aaa;margin-left:auto;flex-shrink:0">'+getStageDef(h.stage.id).lbl+'</span>'
        +'</div>';
    }).join('');
    return '<tr style="border-bottom:1px solid #eee;vertical-align:top">'
      +'<td style="padding:12px 14px;font-size:13px;font-weight:700;white-space:nowrap;width:120px;border-right:1px solid #eee">'+des.name+'</td>'
      +'<td style="padding:12px 14px;width:110px;border-right:1px solid #eee;vertical-align:middle">'+loadIndicator(n)+'<div style="font-size:10px;color:#bbb;margin-top:3px">'+n+' stage'+(n!==1?'s':'')+'</div></td>'
      +'<td style="padding:10px 14px">'+(stageList||'<span style="font-size:12px;color:#ccc;font-style:italic">No active stages this week</span>')+'</td>'
      +'</tr>';
  }).join('');

  // ---- Overall summary stats ----
  var allActiveU=activeProjs.reduce(function(a,p){return a.concat(p.units.filter(function(u){return!u.archived;}));},[]);
  var allSt=allActiveU.reduce(function(a,u){return a.concat(u.stages);},[]);
  var totalDone=allSt.filter(function(s){return s.status==='done';}).length;
  var totalPct=allSt.length?Math.round(totalDone/allSt.length*100):0;
  var highPriUnits=allActiveU.filter(function(u){return u.priority==='high'&&!isUnitComplete(u);}).length;

  var html='<!DOCTYPE html><html><head><meta charset="utf-8">'
    +'<title>Design PM \u2014 Status Report \u2014 '+today+'</title>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:system-ui,-apple-system,sans-serif;background:#f8f8f7;color:#1a1a1a;font-size:14px;line-height:1.5}'
    +'.page{max-width:900px;margin:0 auto;padding:32px 24px}'
    +'.report-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #e5e5e3}'
    +'.report-title{font-size:22px;font-weight:700;color:#1a1a1a}'
    +'.report-sub{font-size:13px;color:#666;margin-top:4px}'
    +'.summary-row{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}'
    +'.stat{background:#fff;border:1px solid #e5e5e3;border-radius:10px;padding:14px 20px;flex:1;min-width:120px}'
    +'.stat-val{font-size:22px;font-weight:700}'
    +'.stat-lbl{font-size:11px;color:#888;margin-top:3px}'
    +'.section-hd{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e5e5e3;display:flex;align-items:baseline;gap:10px}'
    +'.section-sub{font-size:12px;font-weight:400;color:#999}'
    +'@media print{'
    +'body{background:#fff}'
    +'.page{padding:16px}'
    +'.no-print{display:none!important}'
    +'tr,div{page-break-inside:avoid}'
    +'}'
    +'</style>'
    +'</head><body><div class="page">'
    +'<div class="report-hd">'
    +'<div><div class="report-title">&#128196; Design PM &mdash; Weekly Status Report</div>'
    +'<div class="report-sub">Generated '+today+' &middot; '+activeProjs.length+' active project'+(activeProjs.length!==1?'s':'')+' &middot; Sorted by priority then install date</div>'
    +'</div>'
    +'<button class="no-print" onclick="window.print()" style="padding:9px 18px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">&#128438; Print / Save PDF</button>'
    +'</div>'
    +'<div class="summary-row">'
    +'<div class="stat"><div class="stat-val">'+activeProjs.length+'</div><div class="stat-lbl">Active projects</div></div>'
    +'<div class="stat"><div class="stat-val">'+allActiveU.length+'</div><div class="stat-lbl">Active units</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#185FA5">'+totalPct+'%</div><div class="stat-lbl">Overall progress</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#791F1F">'+highPriUnits+'</div><div class="stat-lbl">High priority in progress</div></div>'
    +'</div>'
    +'<div style="background:#fff;border:1px solid #e5e5e3;border-radius:12px;margin-bottom:32px;overflow:hidden">'
    +'<div style="padding:16px 20px;border-bottom:1px solid #e5e5e3;display:flex;align-items:baseline;justify-content:space-between">'
    +'<div class="section-hd" style="margin:0;border:none;padding:0">&#9783; Designer workload this week'
    +'<span class="section-sub">'+weekStart+' &mdash; '+weekEnd+'</span></div>'
    +'<div style="font-size:11px;color:#aaa">&#9679; Free &nbsp; <span style="color:#3A9E5F">&#9679;</span> Light &nbsp; <span style="color:#BA7517">&#9679;</span> Moderate &nbsp; <span style="color:#E24B4A">&#9679;</span> Heavy</div>'
    +'</div>'
    +'<table style="width:100%;border-collapse:collapse">'
    +'<thead><tr style="background:#f5f5f3">'
    +'<th style="padding:8px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:120px;border-right:1px solid #eee">Designer</th>'
    +'<th style="padding:8px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600;width:110px;border-right:1px solid #eee">Load</th>'
    +'<th style="padding:8px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;font-weight:600">Active stages &mdash; by priority</th>'
    +'</tr></thead>'
    +'<tbody>'+workloadRows+'</tbody>'
    +'</table>'
    +'<div style="padding:10px 14px;background:#fafaf9;border-top:1px solid #eee;font-size:11px;color:#aaa">&#9679; Blue dot = In progress &nbsp;&middot;&nbsp; No dot = To do</div>'
    +'</div>'
    +'<div class="section-hd">&#9776; Project status <span class="section-sub">All active projects &mdash; by priority then install date</span></div>'
    +activeProjs.map(projBlock).join('')
    +'<div style="margin-top:32px;padding-top:16px;border-top:1px solid #e5e5e3;font-size:11px;color:#aaa;text-align:center">Design PM &mdash; '+today+'</div>'
    +'</div></body></html>';

  var w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
};

GS.key=null;GS.token=null;GS.tokenExp=0;S.projects=[];
(function init(){
  try{
    var saved=localStorage.getItem('gsheet_key');
    if(saved){
      var parsed=JSON.parse(saved);
      if(parsed&&parsed.private_key&&parsed.client_email&&parsed.token_uri){
        GS.key=parsed;
        document.getElementById('root').innerHTML=
          '<div class="setup-screen"><div class="setup-card" style="text-align:center">'
          +'<h2>&#128274; Connecting to Google Sheets...</h2>'
          +'<p style="margin-top:1rem">Loading your saved key. Please wait.</p>'
          +'<div style="margin-top:1.5rem"><div class="sync-dot syncing" style="margin:0 auto;width:16px;height:16px"></div></div>'
          +'<p style="margin-top:1rem;font-size:11px;color:var(--hint)"><a href="#" onclick="forceSetup()">Click here to reconnect manually</a></p>'
          +'</div></div>';
        loadFromSheets();
        return;
      }
    }
  }catch(e){}
  renderSetup();
})();
</script>
